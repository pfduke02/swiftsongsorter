name: Deploy to Cloudflare

# Needs one repository secret: CLOUDFLARE_API_TOKEN
# (Cloudflare dashboard → My Profile → API Tokens → Create Token → "Edit Cloudflare Workers" template,
#  then add Account → D1 → Edit). The account id lives in wrangler.jsonc.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Ensure the D1 database exists and fill in its id
        run: |
          set -e
          find_id() { npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="swift-song-sorter");process.stdout.write(d?d.uuid:"")'; }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            echo "Creating D1 database swift-song-sorter"
            npx wrangler d1 create swift-song-sorter >/dev/null
            ID="$(find_id)"
          fi
          [ -n "$ID" ] || { echo "Could not determine the D1 database id"; exit 1; }
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$ID/" wrangler.jsonc
          echo "Using D1 database $ID"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply swift-song-sorter --remote

      - name: Deploy Worker
        run: npx wrangler deploy
