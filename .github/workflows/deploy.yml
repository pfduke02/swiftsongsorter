name: Deploy to Cloudflare

# Needs one repository secret: CLOUDFLARE_API_TOKEN
# (Cloudflare dashboard → My Profile → API Tokens → Create Token → "Edit Cloudflare Workers" template,
#  then add Account → D1 → Edit). The account id lives in wrangler.jsonc.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Ensure the D1 database exists and fill in its id
        env:
          ACCOUNT_ID: da7a2954edc68888dc5f7cda1675f778
          DB_NAME: swift-song-sorter
        run: |
          set -e
          api() { curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database$1" \
                    -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "${@:2}"; }
          check() { # print Cloudflare's error messages if the call failed
            if [ "$(echo "$1" | jq -r '.success')" != "true" ]; then
              echo "Cloudflare API call failed:"; echo "$1" | jq -r '.errors[]? | "  [\(.code)] \(.message)"'; exit 1; fi; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          LIST="$(api "?name=$DB_NAME")"; check "$LIST"
          ID="$(echo "$LIST" | jq -r --arg n "$DB_NAME" '.result[] | select(.name==$n) | .uuid' | head -n1)"
          if [ -z "$ID" ]; then
            echo "Creating D1 database $DB_NAME"
            CREATED="$(api "" -X POST --data "{\"name\":\"$DB_NAME\"}")"; check "$CREATED"
            ID="$(echo "$CREATED" | jq -r '.result.uuid')"
          fi
          [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "Could not determine the D1 database id"; exit 1; }
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$ID/" wrangler.jsonc
          echo "Using D1 database $ID"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply swift-song-sorter --remote

      - name: Deploy Worker
        run: npx wrangler deploy
